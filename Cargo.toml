[package]
name = "tagrename"
version = "1.1.0"
edition = "2021"

[dependencies]
eframe = "0.37"
egui = "0.37"
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
walkdir = "2"
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
